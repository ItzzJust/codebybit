[tools]
bun = "1.3.14"
node = "24"

[tasks]
dev = { run = "bun run dev", description = "Start the dev server" }
build = { run = "bun run build", description = "Build for production" }
preview = { run = "bun run preview", description = "Preview the production build" }
typecheck = { run = "bun run typecheck", description = "Type-check all workspaces" }
test = { run = "bun run test", description = "Run tests" }
check = { run = "bun run check", description = "Lint and format check" }
fix = { run = "bun run fix", description = "Auto-fix lint and format issues" }
db-generate = { run = "bun run db:generate", description = "Generate Drizzle migrations" }
db-push = { run = "bun run db:push", description = "Push the Drizzle schema" }
db-studio = { run = "bun run db:studio", description = "Open Drizzle Studio" }
